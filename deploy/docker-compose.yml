name: kanjiforge

# Local dependencies for the app. The app itself is not here: it runs from the repo root
# with `pnpm dev` (or `pnpm build && pnpm start`) and serves its own API under /api/*.
services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    env_file: ${KANJIFORGE_ENV_FILE:-.env}
    # The logical-replication flags are only needed by the optional Electric service
    # below; they are harmless otherwise, so the volume stays compatible either way.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional. Sync works without it: the client polls the authenticated /api/sync
  # snapshot instead. Start it with `--profile electric` and set ELECTRIC_URL and
  # ELECTRIC_SECRET on the app to switch the live read path on.
  electric:
    profiles: ["electric"]
    # Pinned to Electric 1.7.8; update deliberately after the shape-auth spike.
    image: electricsql/electric:1.7.8
    restart: unless-stopped
    env_file: ${KANJIFORGE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  postgres-data:
