# No workspace packages: the API used to live in apps/api and now ships inside the root
# Next.js app (src/server). The file stays for the settings below.
packages: []

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@radix-ui/react-compose-refs@1.1.5'
  - '@radix-ui/react-primitive@2.1.10'
  - '@radix-ui/react-slot@1.3.3'
